<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">VentuSample audio generation and export map</title><desc id="desc">Deterministic project parameters and seed feed a procedural renderer, then bounded offline DSP and optional stochastic routing, followed by PCM16 stereo WAV and versioned JSON manifest export.</desc>
