<rect x="58" y="386" width="1084" height="116" rx="18" fill="#0a1427" stroke="#a5b4fc" stroke-opacity=".8"/><text x="84" y="425" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">RELATED NATIVE MODULES</text><text x="84" y="462" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="16">Plugin SDK · metadata-only manifest discovery · 133 DSP identities / 21 reusable kernels</text><text x="84" y="485" fill="#a5b4fc" font-family="Inter,Arial,sans-serif" font-size="13">Quantum Audio Engine is an offline creative DSP catalogue, not physical quantum computing.</text>
