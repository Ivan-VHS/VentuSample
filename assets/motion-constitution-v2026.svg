<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Motion Constitution v2026 — four-domain desktop ecosystem</title>
  <desc id="desc">A two-by-two architecture map for Reaper IDE, OPlague device inspection, VentuSample offline audio, and Pytyliki processor diagnostics, connected by shared easing, motion scale, accessibility, theme and telemetry rules. Domain features are limited to what each product currently implements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2D"/><stop offset="1" stop-color="#102E4E"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D4ED8"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9F1239"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E7490"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92400E"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity=".34"/></filter>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .mono{font-family:Consolas,Monaco,monospace}
      .title{font-size:42px;font-weight:800;letter-spacing:2px;fill:#F8FAFC}
      .sub{font-size:18px;fill:#B8CBE0}
      .cardtitle{font-size:27px;font-weight:750;fill:#F8FAFC}
      .product{font-size:16px;font-weight:700;letter-spacing:1.2px;fill:#93C5FD}
      .body{font-size:18px;fill:#D5E2F0}
      .muted{font-size:15px;fill:#91A9C2}
      .tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#E2E8F0}
      .token{font-size:15px;fill:#D7E5F4}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>
  <circle cx="1460" cy="65" r="170" fill="#1D4ED8" opacity=".08"/>
  <circle cx="130" cy="900" r="220" fill="#0891B2" opacity=".08"/>
  <text x="82" y="96" class="sans title">MOTION CONSTITUTION <tspan fill="#60A5FA">v2026</tspan></text>
  <text x="84" y="132" class="sans sub">One token system · four native products · state-driven graphics · accessibility first</text>
  <rect x="1290" y="70" width="220" height="42" rx="21" fill="#14395C" stroke="#315E85"/>
  <text x="1400" y="97" text-anchor="middle" class="sans tag">2 × 2 DOMAIN MAP</text>

  <!-- domain cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="178" width="700" height="275" rx="24" fill="#102B48" stroke="#2C557B" stroke-width="2"/>
    <rect x="820" y="178" width="700" height="275" rx="24" fill="#102B48" stroke="#2C557B" stroke-width="2"/>
    <rect x="80" y="478" width="700" height="275" rx="24" fill="#102B48" stroke="#2C557B" stroke-width="2"/>
    <rect x="820" y="478" width="700" height="275" rx="24" fill="#102B48" stroke="#2C557B" stroke-width="2"/>
  </g>

  <!-- IDE card -->
  <rect x="80" y="178" width="9" height="275" rx="4" fill="url(#blue)"/>
  <circle cx="140" cy="234" r="25" fill="#1D4ED8" opacity=".24"/>
  <path d="M128 234h24M140 222v24M130 226l20 16M150 226l-20 16" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  <text x="184" y="225" class="sans product">01 / IDE &amp; AI WORKSPACE</text>
  <text x="184" y="265" class="sans cardtitle">Reaper Studio</text>
  <text x="120" y="315" class="sans body">Project tree · editor · CODEX-66 · local LSP / DAP</text>
  <text x="120" y="349" class="sans body">Bounded Tk spring feedback and persisted accessibility</text>
  <rect x="120" y="383" width="185" height="30" rx="15" fill="#163F6B"/>
  <text x="212" y="403" text-anchor="middle" class="sans tag">NATIVE IDE TOOLING</text>
  <text x="330" y="402" class="sans muted">No cloud AI / streamed diff claim</text>

  <!-- driver card -->
  <rect x="820" y="178" width="9" height="275" rx="4" fill="url(#red)"/>
  <circle cx="880" cy="234" r="25" fill="#BE123C" opacity=".22"/>
  <rect x="868" y="221" width="24" height="27" rx="4" stroke="#FDA4AF" stroke-width="2" fill="none"/>
  <path d="M874 216v5m12-5v5m-12 27v5m12-5v5M864 228h4m24 0h4m-32 10h4m24 0h4" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>
  <text x="924" y="225" class="sans product" fill="#FDA4AF">02 / DRIVERS &amp; PERIPHERALS</text>
  <text x="924" y="265" class="sans cardtitle">OPlague</text>
  <text x="860" y="315" class="sans body">PnP inventory · INF / ZIP evidence · SHA-256</text>
  <text x="860" y="349" class="sans body">Candidate compatibility graph · read-only workbench</text>
  <rect x="860" y="383" width="168" height="30" rx="15" fill="#4C1D35"/>
  <text x="944" y="403" text-anchor="middle" class="sans tag">READ ONLY</text>
  <text x="1050" y="402" class="sans muted">No firmware OTA / driver writes</text>

  <!-- DAW card -->
  <rect x="80" y="478" width="9" height="275" rx="4" fill="url(#cyan)"/>
  <circle cx="140" cy="534" r="25" fill="#0E7490" opacity=".25"/>
  <path d="M121 534h7l5-13 7 26 7-20 5 7h8" fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="184" y="525" class="sans product">03 / DAW &amp; MIXER</text>
  <text x="184" y="565" class="sans cardtitle">VentuSample</text>
  <text x="120" y="615" class="sans body">Qt generator · offline DSP lab · plugin platform</text>
  <text x="120" y="649" class="sans body">Project-BPM indicator · sample-pack WAV export</text>
  <rect x="120" y="683" width="168" height="30" rx="15" fill="#164B59"/>
  <text x="204" y="703" text-anchor="middle" class="sans tag">OFFLINE AUDIO</text>
  <text x="310" y="702" class="sans muted">No real-time DAW transport claim</text>

  <!-- CPU card -->
  <rect x="820" y="478" width="9" height="275" rx="4" fill="url(#gold)"/>
  <circle cx="880" cy="534" r="25" fill="#92400E" opacity=".25"/>
  <rect x="865" y="519" width="30" height="30" rx="5" fill="none" stroke="#FCD34D" stroke-width="2"/>
  <path d="M872 526h16v16h-16zM860 526h5m30 0h5M860 542h5m30 0h5M872 514v5m16-5v5m-16 30v5m16-5v5" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
  <text x="924" y="525" class="sans product" fill="#FCD34D">04 / PROCESSORS &amp; TELEMETRY</text>
  <text x="924" y="565" class="sans cardtitle">Pytyliki</text>
  <text x="860" y="615" class="sans body">Processor discovery · bounded benchmarks · workload plans</text>
  <text x="860" y="649" class="sans body">Static diagnostics · local DSP · sourced measurements</text>
  <rect x="860" y="683" width="188" height="30" rx="15" fill="#594018"/>
  <text x="954" y="703" text-anchor="middle" class="sans tag">DIAGNOSTIC ONLY</text>
  <text x="1065" y="702" class="sans muted">No overclock / voltage writes</text>

  <!-- motion spine -->
  <rect x="80" y="786" width="1440" height="150" rx="22" fill="#0B2036" stroke="#315E85" stroke-width="2"/>
  <text x="116" y="828" class="sans product">SHARED MOTION &amp; GRAPHICS CONTRACT</text>
  <line x1="116" y1="846" x2="1484" y2="846" stroke="#254764"/>
  <text x="116" y="884" class="mono token">--ease-spring</text>
  <text x="116" y="910" class="sans muted">bounded response</text>
  <text x="405" y="884" class="mono token">--ease-snappy</text>
  <text x="405" y="910" class="sans muted">predictable state</text>
  <text x="702" y="884" class="mono token">--motion-scale</text>
  <text x="702" y="910" class="sans muted">0.4×–2.2×</text>
  <text x="990" y="884" class="sans token">REDUCED MOTION</text>
  <text x="990" y="910" class="sans muted">system override · no lost state</text>
  <text x="1290" y="884" class="sans token">SVG / CANVAS</text>
  <text x="1290" y="910" class="sans muted">real model data only</text>
</svg>