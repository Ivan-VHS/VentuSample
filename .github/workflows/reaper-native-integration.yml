name: Reaper native C17 integration
on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "src/reaper_expression.*"
      - "tests/test_reaper_expression.cpp"
      - ".github/workflows/reaper-native-integration.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reaper-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Ivan-VHS/Reaper
          ref: 9182d732979add77d946d573f0d105c44b9b4eed
          path: _deps/Reaper
      - name: Configure linked C++20 + C17 build
        run: cmake -S . -B build -DVENTU_BUILD_DESKTOP=OFF -DREAPER_SOURCE_DIR="$GITHUB_WORKSPACE/_deps/Reaper" -DCMAKE_BUILD_TYPE=Release
      - name: Build the linked expression bridge
        run: cmake --build build --parallel --target ventusample_reaper_expression_tests
      - name: Test native evaluation and exact selfhood lookup
        run: ctest --test-dir build --output-on-failure -R '^ventusample-reaper-expression-bridge$'
