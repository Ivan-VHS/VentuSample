name: Reaper native C17 integration
on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "src/reaper_expression.*"
      - "tests/test_reaper_expression.cpp"
      - "integrations/reaper/**"
      - ".github/workflows/reaper-native-integration.yml"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reaper-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Ivan-VHS/Reaper
          ref: 4450a14e74375b01d915f3d685aeccd660413da2
          path: _deps/Reaper
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and execute offline neural audio contract
        env:
          PYTHONPATH: ${{ github.workspace }}/_deps/Reaper
        run: |
          set -euo pipefail
          python -m reaper --check integrations/reaper/neural_audio_contract.rpr
          python -m reaper integrations/reaper/neural_audio_contract.rpr | tee reaper-neural-audio.txt
          grep -qx "VENTUSAMPLE_REAPER_NEURAL_AUDIO:PASS" reaper-neural-audio.txt
      - name: Validate and execute Reaper audio contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/_deps/Reaper
        run: |
          set -euo pipefail
          python -m reaper --check integrations/reaper/audio_contract.rpr
          python -m reaper integrations/reaper/audio_contract.rpr | tee reaper-audio-contract.txt
          grep -qx "VENTUSAMPLE_REAPER_AUDIO_CONTRACT:PASS" reaper-audio-contract.txt
      - name: Configure linked C++20 + C17 build
        run: cmake -S . -B build -DVENTU_BUILD_DESKTOP=OFF -DREAPER_SOURCE_DIR="$GITHUB_WORKSPACE/_deps/Reaper" -DCMAKE_BUILD_TYPE=Release
      - name: Build the linked expression bridge
        run: cmake --build build --parallel --target ventusample_reaper_expression_tests
      - name: Test native evaluation and exact selfhood lookup
        run: ctest --test-dir build --output-on-failure -R '^ventusample-reaper-expression-bridge$'
