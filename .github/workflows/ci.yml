name: VentuSample CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
    paths-ignore:
      - "assets/screenshots/**"

permissions:
  contents: read

concurrency:
  group: ventusample-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contract:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate translated README structure and links
        run: python .github/scripts/check_readme_links.py
      - name: Validate every tracked Markdown document and local anchor
        run: python tools/validate_markdown_inventory.py
      - name: Test Markdown integrity validator
        run: python -m unittest discover -s tests -p "test_markdown_inventory.py" -v
      - name: Compile Python verification tools
        run: |
          python -m py_compile scripts/validate_automation_roadmap.py scripts/validate_resilience_policy.py tools/validate_project_contract.py tools/validate_generated_fixture.py tools/validate_visual_canon.py
          python tools/validate_visual_canon.py src/mainwindow.cpp
      - name: Validate engineering evolution contract
        run: python tools/validate_engineering_evolution.py
      - name: Validate 20-workstream automation roadmap and evidence paths
        run: python scripts/validate_automation_roadmap.py --strict
      - name: Validate roadmap governance and bounded CI scale
        run: python tools/validate_delivery_contracts.py --self-test
      - name: Test governance and CI scale regressions
        run: python -m unittest discover -s tests -p "test_delivery_contracts.py" -v
      - name: Validate offline resilience and trust policy
        run: python scripts/validate_resilience_policy.py
      - name: Test resilience and trust policy
        run: python -m unittest discover -s tests -p "test_resilience_policy.py" -v
      - name: Test local-first ecosystem cloud adapter contract
        run: python -m unittest discover -s tests -p "test_ecosystem_cloud_contract.py" -v
      - name: Test engineering evolution contract
        run: python -m unittest discover -s tests -p "test_engineering_evolution.py" -v
      - name: Test bounded manual CI recovery policy
        run: python -m unittest discover -s tests -p "test_safe_rerun.py" -v
      - name: Test CLife snapshots
        run: python -m unittest discover -s tests -p "test_clife.py" -v
      - name: Validate project contract and OCTA-8 federation
        run: python tools/validate_project_contract.py
      - name: Parse versioned pack schema and project contract
        run: |
          python -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ('project-contract.json', 'schemas/ventusample.pack.v1.schema.json', 'federation/octa-pyramid.v1.json')]"

  native-engine:
    # Existing repository rules require this historical status context.
    # The actual compiled product engine is C++20 and is built/tested below.
    name: Native C
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure native C++20 engine
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVENTU_BUILD_DESKTOP=OFF -DVENTU_BUILD_TESTS=ON
      - name: Build native engine
        run: cmake --build build --parallel 2
      - name: Run audio and manifest tests
        run: ctest --test-dir build --output-on-failure

  linux-core-and-desktop:
    name: Linux DSP + Qt desktop build
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVENTU_BUILD_DESKTOP=ON -DVENTU_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-native-desktop:
    name: Windows 11 native Qt desktop build
    timeout-minutes: 40
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6 Widgets
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DVENTU_BUILD_DESKTOP=ON -DVENTU_BUILD_TESTS=ON
      - name: Build native app and tests
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Capture live desktop screenshot
        shell: pwsh
        run: .github/scripts/capture_desktop_screenshot.ps1 -FilePath "build/Release/VentuSample.exe" -OutputPath "assets/screenshots/ventusample-studio.png" -StartupSeconds 15
      - name: Commit screenshot to same-repository pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'refresh-screenshot')
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/screenshots/ventusample-studio.png"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: refresh live VentuSample screenshot"
            git fetch origin "$env:TARGET_BRANCH"
            git rebase "origin/$env:TARGET_BRANCH"
            git push origin "HEAD:$env:TARGET_BRANCH"
          } else {
            Write-Host "Screenshot is unchanged; no repository commit is needed."
          }
      - name: Upload live desktop screenshot artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ventusample-live-windows-screenshot
          path: assets/screenshots/ventusample-studio.png
          if-no-files-found: error
          retention-days: 30
