name: i18n contract

on:
  push:
    branches: [main, master]
    paths: ["i18n/**", "tools/check_i18n.mjs", ".github/workflows/i18n-contract.yml"]
  pull_request:
    paths: ["i18n/**", "tools/check_i18n.mjs", ".github/workflows/i18n-contract.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate language tags and catalogs
        run: node tools/check_i18n.mjs
