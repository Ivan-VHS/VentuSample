name: Verified Mainline Auto-Merge

on:
  workflow_run:
    workflows: ["VentuSample CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ventusample-verified-auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    name: Enable squash auto-merge after complete CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the tested PR head and enable native auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail

          numbers="$(jq -r '.[].number // empty' <<< "$PULL_REQUESTS_JSON")"
          if [[ -z "$numbers" ]]; then
            echo "No associated pull request; nothing to merge."
            exit 0
          fi

          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            head_sha="$(jq -r '.head.sha' <<< "$pr")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr")"
            base_ref="$(jq -r '.base.ref' <<< "$pr")"
            draft="$(jq -r '.draft' <<< "$pr")"
            url="$(jq -r '.html_url' <<< "$pr")"
            auto_merge="$(jq -r 'if .auto_merge == null then "false" else "true" end' <<< "$pr")"

            if [[ "$head_repo" != "$GITHUB_REPOSITORY" || "$base_ref" != "main" || "$draft" != "false" ]]; then
              echo "SKIP PR #$number: not an eligible same-repository, non-draft main PR."
              continue
            fi
            if [[ "$head_sha" != "$TESTED_HEAD_SHA" ]]; then
              echo "SKIP PR #$number: CI result is for an older commit."
              continue
            fi
            if [[ "$auto_merge" == "true" ]]; then
              echo "OK PR #$number: native auto-merge is already enabled."
              continue
            fi

            attempt=1
            while (( attempt <= 5 )); do
              # Revalidate immediately before every attempt; CI only authorizes this exact SHA.
              latest_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
              latest_head="$(jq -r '.head.sha' <<< "$latest_pr")"
              latest_repo="$(jq -r '.head.repo.full_name // ""' <<< "$latest_pr")"
              latest_base="$(jq -r '.base.ref' <<< "$latest_pr")"
              latest_draft="$(jq -r '.draft' <<< "$latest_pr")"
              latest_auto="$(jq -r 'if .auto_merge == null then "false" else "true" end' <<< "$latest_pr")"
              latest_merged="$(jq -r '.merged' <<< "$latest_pr")"
              if [[ "$latest_head" != "$TESTED_HEAD_SHA" || "$latest_repo" != "$GITHUB_REPOSITORY" || "$latest_base" != "main" || "$latest_draft" != "false" ]]; then
                echo "SKIP PR #$number: eligibility changed; refusing to retry."
                break
              fi
              if [[ "$latest_auto" == "true" || "$latest_merged" == "true" ]]; then
                echo "OK PR #$number: auto-merge is already enabled or the PR is merged."
                break
              fi
              set +e
              output="$(gh pr merge "$url" --auto --squash --delete-branch 2>&1)"
              status=$?
              set -e
              printf '%s\\n' "$output"
              if [[ "$status" -eq 0 ]]; then break; fi

              # The mutation may have succeeded despite a lost/transient response.
              state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" 2>/dev/null || true)"
              if [[ -z "$state" ]]; then
                echo "Cannot revalidate PR state after the failed request; refusing to retry." >&2
                exit "$status"
              fi
              if [[ -n "$state" ]]; then
                state_head="$(jq -r '.head.sha' <<< "$state")"
                state_repo="$(jq -r '.head.repo.full_name // ""' <<< "$state")"
                state_base="$(jq -r '.base.ref' <<< "$state")"
                state_draft="$(jq -r '.draft' <<< "$state")"
                state_auto="$(jq -r 'if .auto_merge == null then "false" else "true" end' <<< "$state")"
                state_merged="$(jq -r '.merged' <<< "$state")"
                if [[ "$state_auto" == "true" || "$state_merged" == "true" ]]; then
                  echo "OK PR #$number: GitHub accepted the auto-merge request."
                  break
                fi
                if [[ "$state_head" != "$TESTED_HEAD_SHA" || "$state_repo" != "$GITHUB_REPOSITORY" || "$state_base" != "main" || "$state_draft" != "false" ]]; then
                  echo "SKIP PR #$number: eligibility changed; refusing to retry."
                  break
                fi
              fi

              if ! grep -Eiq 'GraphQL:.*Something went wrong|502 Bad Gateway|503 Service Unavailable|504 Gateway Time-out|HTTP 5(02|03|04)|connection reset|timed out|temporary failure' <<< "$output"; then
                echo "Auto-merge failed for a non-transient reason; not retrying." >&2
                exit "$status"
              fi
              if (( attempt == 5 )); then
                echo "Auto-merge unavailable after five attempts." >&2
                exit "$status"
              fi
              delay=$((attempt * 3))
              echo "::warning::Transient GitHub API failure; retrying in $delay seconds."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          done <<< "$numbers"
