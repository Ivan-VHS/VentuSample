name: Veelsevul AppGuard
on:
  pull_request:
  push:
    branches: [main, "feat/**", "security/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: veelsevul-appguard-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy-and-runtime:
    name: Policy registry and C11 runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history for diff scanning
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate 66 repository rules and 666 AppGuard levels
        run: python3 .veelsevul/guard.py
      - name: Compile portable C11 runtime checks
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            .veelsevul/runtime/appguard.c \
            .veelsevul/runtime/test_appguard.c \
            -o /tmp/veelsevul-appguard-test
      - name: Run AppGuard runtime smoke tests
        run: /tmp/veelsevul-appguard-test
      - name: Scan changed files for credential leakage and hidden controls
        env:
          BASE_SHA: \${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 .veelsevul/guard.py --scan-base "$BASE_SHA"
          else
            python3 .veelsevul/guard.py --scan-head
          fi
