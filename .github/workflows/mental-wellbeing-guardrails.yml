name: Mental Wellbeing Code Guardrails

on:
  push:
    branches: [main, "feat/**", "fix/**", "security/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-contract:
    name: Validate wellbeing and privacy guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate policy contract and project boundaries
        run: python scripts/check_mental_wellbeing_guardrails.py
