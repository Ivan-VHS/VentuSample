name: Product Readiness Contract

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "product-readiness.json"
      - "scripts/validate_product_readiness.py"
      - "docs/QUALITY_COHESION_COMMERCIAL_STANDARD.md"
      - ".github/workflows/product-readiness.yml"
  pull_request:
    paths:
      - "product-readiness.json"
      - "scripts/validate_product_readiness.py"
      - "docs/QUALITY_COHESION_COMMERCIAL_STANDARD.md"
      - ".github/workflows/product-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate evidence-backed product passport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test scoring semantics
        run: python scripts/validate_product_readiness.py --self-test
      - name: Validate product passport and evidence paths
        run: python scripts/validate_product_readiness.py --json
