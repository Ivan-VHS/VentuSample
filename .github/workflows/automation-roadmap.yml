name: Automation Roadmap Contract

on:
  push:
    branches: [main]
    paths:
      - "automation-roadmap.v1.json"
      - "automation-roadmap.v1.schema.json"
      - "docs/AUTOMATION_ROADMAP.md"
      - "scripts/validate_automation_roadmap.py"
      - ".architecture/automation-rerun-policy.v1.json"
      - ".architecture/automation-rerun-policy.v1.schema.json"
      - "scripts/validate_safe_rerun.py"
      - "tests/test_safe_rerun.py"
      - ".github/workflows/safe-ci-recovery.yml"
      - ".github/ISSUE_TEMPLATE/engineering_improvement.yml"
      - ".architecture/resilience-policy.json"
      - ".architecture/resilience-policy.schema.json"
      - "scripts/validate_resilience_policy.py"
      - "tests/test_resilience_policy.py"
      - "docs/RESILIENCE_POLICY.md"
      - ".github/workflows/automation-roadmap.yml"
  pull_request:
    paths:
      - "automation-roadmap.v1.json"
      - "automation-roadmap.v1.schema.json"
      - "docs/AUTOMATION_ROADMAP.md"
      - "scripts/validate_automation_roadmap.py"
      - ".architecture/automation-rerun-policy.v1.json"
      - ".architecture/automation-rerun-policy.v1.schema.json"
      - "scripts/validate_safe_rerun.py"
      - "tests/test_safe_rerun.py"
      - ".github/workflows/safe-ci-recovery.yml"
      - ".github/ISSUE_TEMPLATE/engineering_improvement.yml"
      - ".architecture/resilience-policy.json"
      - ".architecture/resilience-policy.schema.json"
      - "scripts/validate_resilience_policy.py"
      - "tests/test_resilience_policy.py"
      - "docs/RESILIENCE_POLICY.md"
      - ".github/workflows/automation-roadmap.yml"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-roadmap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate roadmap, evidence, and safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate automation roadmap
        run: python scripts/validate_automation_roadmap.py --strict
      - name: Test bounded manual CI recovery policy
        run: python -m unittest discover -s tests -p "test_safe_rerun.py" -v
      - name: Validate resilience and trust policy
        run: python scripts/validate_resilience_policy.py
      - name: Test resilience and trust policy
        run: python -m unittest discover -s tests -p "test_resilience_policy.py" -v
