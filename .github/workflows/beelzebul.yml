name: Beelzebul security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beelzebul-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Beelzebul 66-rule scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate and base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate policy JSON and Schema shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("security/beelzebul.v1.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("schemas/beelzebul.security.v1.schema.json").read_text(encoding="utf-8"))
          assert policy["schema"] == "beelzebul.security.v1"
          assert policy["rule_count"] == len(policy["rules"]) == 66
          assert schema["properties"]["rules"]["maxItems"] == 66
          PY
      - name: Run Beelzebul regression tests
        run: python3 -m unittest discover -s tests -p "test_beelzebul.py" -v
      - name: Run read-only repository scan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$BASE_REF" ]; then ARGS+=(--base-ref "$BASE_REF"); fi
          python3 tools/beelzebul.py --json --output "$RUNNER_TEMP/beelzebul-report.json" "${ARGS[@]}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/beelzebul-report.json").read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "# Beelzebul security scan\n\n"
              f"- Verdict: **{report['verdict']}**\n"
              f"- Risk score: **{report['risk_score']}/100**\n"
              f"- Rules: **{report['policy']['rules_total']}**\n"
              f"- Findings: **{report['findings_count']}**\n"
              f"- Files scanned: **{report['scan']['text_files_scanned']}**\n",
              encoding="utf-8",
          )
          PY
