name: Beelzebul repository guard

on:
  pull_request:
  push:
    branches: [main, "security/**"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beelzebul-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guard:
    name: Beelzebul / 66-rule audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run scanner regression, privacy and fuzz tests
        run: python -m unittest discover -s security/beelzebul -p "test_*.py" -v

      - name: Audit changed files and added Git history (pull request)
        if: github.event_name == 'pull_request'
        env:
          BEELZEBUL_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          python security/beelzebul/scanner.py --root . --format json
          --output beelzebul-report.json --base-ref "$BEELZEBUL_BASE"
          --changed-only --fail-on high

      - name: Audit changed files and added Git history (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEELZEBUL_BASE: ${{ github.event.before }}
        run: >-
          python security/beelzebul/scanner.py --root . --format json
          --output beelzebul-report.json --base-ref "$BEELZEBUL_BASE"
          --changed-only --fail-on high

      - name: Full-tree audit (schedule, manual or initial push)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: >-
          python security/beelzebul/scanner.py --root . --format json
          --output beelzebul-report.json

      - name: Check peer policy and scanner parity
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python security/beelzebul/federation.py --root . --ref main

      - name: Enforce scheduled peer parity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python security/beelzebul/federation.py --root . --ref main --strict

      - name: Upload redacted audit evidence
        if: always() && hashFiles('beelzebul-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beelzebul-audit-${{ github.run_id }}
          path: beelzebul-report.json
          if-no-files-found: error
          retention-days: 30
