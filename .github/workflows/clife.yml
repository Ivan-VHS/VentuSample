name: CLife recovery tests

on:
  push:
    branches: [main, feat/clife-savepoint-stitch-revival]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clife:
    name: CLife recovery tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile CLife utility
        run: python -m py_compile tools/clife/clife.py tools/clife/test_clife.py
      - name: Run recovery safety tests
        run: python tools/clife/test_clife.py
      - name: Check CLI entry point
        run: python tools/clife/clife.py --help
