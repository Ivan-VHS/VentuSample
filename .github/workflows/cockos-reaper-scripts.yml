name: Cockos REAPER helpers

on:
  push:
    branches: [main, "feat/**", "refactor/**"]
    paths: ["integrations/cockos-reaper/**", "tests/test_cockos_reaper_scripts.py", "docs/integrations/COCKOS_REAPER.md", ".github/workflows/cockos-reaper-scripts.yml"]
  pull_request:
    paths: ["integrations/cockos-reaper/**", "tests/test_cockos_reaper_scripts.py", "docs/integrations/COCKOS_REAPER.md", ".github/workflows/cockos-reaper-scripts.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test script safety contract
        run: python -m unittest discover -s tests -p test_cockos_reaper_scripts.py -v
      - name: Package Lua actions
        run: |
          mkdir -p dist/cockos-reaper-kora
          cp integrations/cockos-reaper/kora/*.lua dist/cockos-reaper-kora/
          cp docs/integrations/COCKOS_REAPER.md dist/cockos-reaper-kora/README.md
          cd dist && zip -r cockos-reaper-kora.zip cockos-reaper-kora
      - uses: actions/upload-artifact@v4
        with:
          name: ventusample-cockos-reaper-helpers
          path: dist/cockos-reaper-kora.zip
          if-no-files-found: error
